        テックリード・チームリーダーとして、プロダクト開発、ソフトウェアアーキテクチャ、組織改善をリードし、SwiftUI移行とSwift 6関連警告の約94%削減を推進。
        Mobile全体のSLI・SLO策定、ADRの定着、ソフトウェアライフサイクルの計測を進め、PR待機時間を70%以上削減。
        全社推奨アーキテクチャの維持、新卒研修の教材刷新、DMM.swiftの再始動、技術カンファレンスの企業ブース企画・運営を主導。
    - role: Software Engineer, iOS
      period: 2020.9 — 2021.3
      employmentType: 内定者アルバイト
      detail: >-
        入社前からiOSアプリ開発に参加し、要求定義から運用まで一貫して担当。
        プロジェクトリーダーとして新機能の開発を推進し、多数のユーザーが利用するコア機能へ成長させた。
