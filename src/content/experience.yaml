- id: dmm
  company: DMM.com
  period: 2020.9 — 現在
  order: 1
  roles:
    - role: Software Engineer, AI/LLM / Platform
      period: 2025.12 — 現在
      detail: >-
        AI/LLMを業務へ適用するエージェントアプリケーションと、FastAPI・GCPを用いたバックエンドの設計・実装を担当。
        根拠と権限を制御して挙動を予測・監査できる実行基盤を構築し、複数観点から品質を継続評価する仕組みを設計。
