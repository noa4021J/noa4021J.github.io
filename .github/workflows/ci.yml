name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.30.3
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Configure git for private design-system dependency
        # pnpm はロックファイル解決時に git 依存の URL を SSH 形式
        # （git@github.com:...）へ正規化することがあるため、
        # https:// 形式・SSH 形式の両方を書き換える。
        run: |
          git config --global url."https://x-access-token:${{ secrets.DESIGN_SYSTEM_PAT }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ secrets.DESIGN_SYSTEM_PAT }}@github.com/".insteadOf "git@github.com:"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Astro
        run: pnpm astro check
      - name: Build site
        run: pnpm build
